<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Arial, sans-serif" direction="rtl">
  <rect width="760" height="560" fill="#fffefa"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#984629"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#192c2b">הלרינקס במבט מלפנים: שלוש הקומות ומקום הקוניוטומיה</text>

  <!-- hyoid -->
  <path d="M250 78 Q380 62 510 78" fill="none" stroke="#7d6f55" stroke-width="10" stroke-linecap="round"/>
  <text x="528" y="84" text-anchor="end" font-size="13" fill="#485c56">עצם ההיואיד</text>
  <!-- thyrohyoid membrane -->
  <path d="M262 86 L282 112 M498 86 L478 112" stroke="#c9cec1" stroke-width="2"/>

  <!-- thyroid cartilage (shield with notch) -->
  <path d="M270 112 L362 112 L380 132 L398 112 L490 112 L470 262 Q380 300 290 262 Z" fill="#dfe8db" stroke="#174a43" stroke-width="3"/>
  <text x="380" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#174a43">סחוס התירואיד</text>
  <text x="380" y="182" text-anchor="middle" font-size="12" fill="#174a43">(תפוח האדם)</text>

  <!-- internal vocal cords (dashed, inside thyroid cartilage) -->
  <path d="M318 222 L380 214 L442 222" fill="none" stroke="#984629" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="380" y="243" text-anchor="middle" font-size="12" fill="#984629">מיתרי הקול (בתוך התירואיד)</text>

  <!-- cricothyroid membrane -->
  <path d="M300 268 Q380 296 460 268 L452 300 Q380 318 308 300 Z" fill="#f7d9cc" stroke="#984629" stroke-width="2"/>

  <!-- cricoid ring -->
  <path d="M300 302 Q380 324 460 302 L456 336 Q380 356 304 336 Z" fill="#dfe8db" stroke="#174a43" stroke-width="3"/>
  <text x="380" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#174a43">קריקואיד</text>

  <!-- trachea rings -->
  <g fill="#eef2ea" stroke="#174a43" stroke-width="2">
    <path d="M312 352 Q380 370 448 352 L446 370 Q380 388 314 370 Z"/>
    <path d="M314 380 Q380 398 446 380 L444 398 Q380 416 316 398 Z"/>
    <path d="M316 408 Q380 426 444 408 L442 426 Q380 444 318 426 Z"/>
    <path d="M318 436 Q380 454 442 436 L440 454 Q380 472 320 454 Z"/>
  </g>
  <text x="380" y="500" text-anchor="middle" font-size="13" fill="#485c56">טבעות הקנה (מקום הטרכאוסטומיה)</text>

  <!-- conitomy arrow (left side) -->
  <path d="M170 286 L296 286" stroke="#984629" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="24" y="262" width="150" height="50" rx="6" fill="#fbefe8" stroke="#984629" stroke-width="2"/>
  <text x="99" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#984629">ממברנה קריקו־תירואידית</text>
  <text x="99" y="301" text-anchor="middle" font-size="12" fill="#984629">כאן מבצעים קוניוטומיה</text>

  <!-- level brackets (right side) -->
  <g stroke="#192c2b" stroke-width="2" fill="none">
    <path d="M520 112 h14 v98 h-14"/>
    <path d="M520 214 h14 v12 h-14"/>
    <path d="M520 232 h14 v104 h-14"/>
  </g>
  <rect x="546" y="138" width="190" height="46" rx="6" fill="#eef2ea"/>
  <text x="641" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#192c2b">סופראגלוטיס</text>
  <text x="641" y="175" text-anchor="middle" font-size="12" fill="#485c56">מעל המיתרים · עשיר בלימפה</text>
  <rect x="546" y="198" width="190" height="46" rx="6" fill="#e1ece0"/>
  <text x="641" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#192c2b">גלוטיס</text>
  <text x="641" y="235" text-anchor="middle" font-size="12" fill="#485c56">המיתרים · סרטן שכיח ומוקדם</text>
  <rect x="546" y="262" width="190" height="46" rx="6" fill="#eef2ea"/>
  <text x="641" y="281" text-anchor="middle" font-size="14" font-weight="bold" fill="#192c2b">סובגלוטיס</text>
  <text x="641" y="299" text-anchor="middle" font-size="12" fill="#485c56">עד הקריקואיד · צר בילדים</text>

  <!-- stridor key -->
  <rect x="24" y="404" width="230" height="122" rx="8" fill="#f3efe4" stroke="#c9cec1"/>
  <text x="139" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#192c2b">סוג הסטרידור</text>
  <text x="139" y="452" text-anchor="middle" font-size="12" fill="#192c2b">שאיפתי: סופראגלוטיס או גלוטיס</text>
  <text x="139" y="474" text-anchor="middle" font-size="12" fill="#192c2b">דו־פאזי: גלוטיס או סובגלוטיס</text>
  <text x="139" y="496" text-anchor="middle" font-size="12" fill="#192c2b">נשיפתי: קנה בחזה וברונכים</text>
</svg>
